name: 開催中の人数チェック

on:
  schedule:
    - cron: "*/15 * * * *"   # 15分ごと(会期外のシリーズは live.py が何もしない)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/live.py
      - name: 変化があれば公開し直す
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*/live.json'
          git diff --cached --quiet || (git commit -q -m "人数チェック $(TZ=Asia/Tokyo date '+%F %H:%M')" && git pull -q --rebase && git push)
