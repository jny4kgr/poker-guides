name: 開催中の人数チェック

# GitHub の定期実行(schedule)はこのリポジトリでは数時間単位で遅れる・飛ばされるので、
# 1回の実行の中で10分ごとに取り直し続け、5時間半たったら自分自身を起動し直す(1ジョブの上限は6時間)。
# schedule は止まったときの予備。会期中のシリーズが無ければすぐ終わる。
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 10分ごとに人数を取り直して公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while python tools/live.py --check && [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase || true
            python tools/live.py || true
            git add -A -- '*/live.json'
            git diff --cached --quiet || (git commit -q -m "人数チェック $(TZ=Asia/Tokyo date '+%F %H:%M')" && (git push -q || (git pull -q --rebase && git push -q)))
            sleep 600
          done
      - name: 会期中なら次の回を起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python tools/live.py --check; then gh workflow run live.yml --ref main; fi
