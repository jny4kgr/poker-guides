<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>APT Championship Taipei 2026</title>
<style>
:root{--black:#111;--gold:#d9b45e;--cream:#f4ead1;--paper:#f5f6f7;--ink:#151515;--muted:#6d7279;--line:#dedede}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;background:var(--paper);color:var(--ink)}body.locked{overflow:hidden}button,input{font:inherit}.hero{background:radial-gradient(circle at 86% 8%,#564820 0,transparent 30%),linear-gradient(135deg,#080808,#1d1d1d);color:white;padding:30px 18px 52px}.wrap,main{width:min(1120px,100%);margin:auto}.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.2em}h1{font-size:clamp(30px,6vw,52px);margin:8px 0 4px;line-height:1}.sub,.meta{color:#d5d5d5}.sub{margin:0;font-weight:650}.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px;font-size:13px}main{margin-top:-28px;padding:0 16px 60px}
.controls{position:sticky;top:0;z-index:5;background:#fffffff2;border-radius:18px;padding:14px;box-shadow:0 14px 34px #0002;backdrop-filter:blur(10px);transition:transform .26s cubic-bezier(.4,0,.2,1),opacity .2s ease;will-change:transform}
.controls.away{transform:translateY(calc(-100% - 40px));opacity:0;pointer-events:none}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.tab,.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:800}.tab.active{background:var(--black);color:var(--gold);border-color:var(--black)}.tab small{opacity:.65;margin-left:4px}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}.label{font-size:11px;font-weight:900;color:var(--muted)}.chip{padding:7px 11px;font-size:13px}.chip.active{background:var(--cream);border-color:#d5bf87}.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;outline:none}.status{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}.status h2{margin:0}.status span{color:var(--muted);font-size:13px}.day{margin:24px 0 34px}.day-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}.day-title strong{font-size:21px}.day-title span{color:var(--muted);font-size:13px}.day-title:after{content:"";height:1px;background:var(--line);flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.event{position:relative;overflow:hidden;background:white;border:1px solid var(--line);border-radius:16px;padding:16px 17px 15px 21px;box-shadow:0 4px 14px #0000000c;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .12s ease}
.event:active{transform:scale(.985);box-shadow:0 2px 8px #00000014}
.event:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--gold)}.event.sat:before{background:#4aa0c6}.event.cont:before{background:#999}.event.other:before{background:#8465ad}.top{display:flex;justify-content:space-between;gap:10px}.no{color:#8a6a1e;font-size:13px;font-weight:900}.badge{background:#f0f0f0;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.event h3{font-size:17px;line-height:1.4;margin:8px 0 12px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 16px}.fact small{display:block;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.05em}.fact b{display:block;margin-top:2px;font-size:14px}.price{color:#7a5a00}.note{border-top:1px dashed var(--line);padding-top:10px;color:var(--muted);font-size:12px}.more{margin-top:11px;color:#8a6a1e;font-size:11px;font-weight:850;letter-spacing:.04em}.empty,.loading{text-align:center;padding:70px 16px;color:var(--muted)}.error{background:#fff1f2;color:#9d2732;padding:18px;border-radius:14px}footer{text-align:center;color:var(--muted);font-size:11px;padding:10px 16px 28px}
.backdrop{position:fixed;inset:0;background:#00000073;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:20}.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(680px,100%);max-height:90vh;transform:translate(-50%,102%);background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -14px 40px #0003;z-index:21;transition:transform .28s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translate(-50%,0)}
.handle{flex:none;padding:9px 0 4px;display:flex;justify-content:center;cursor:grab}.handle:after{content:"";width:42px;height:4px;border-radius:4px;background:#c8ccd0}
.sheet-head{flex:none;padding:6px 20px 14px;border-bottom:1px solid var(--line)}.sheet-head .no{font-size:12px}.sheet-head h3{margin:6px 0 9px;font-size:20px;line-height:1.35}.sheet-head .badge{margin-right:6px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 26px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-bottom:20px}.dl div{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.dl small{display:block;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.05em}.dl b{display:block;margin-top:3px;font-size:15px}.dl b em{display:inline-block;white-space:nowrap;font-style:normal;color:var(--muted);font-size:12px;font-weight:600;margin-left:5px}
.lv{background:white;border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px}.lv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.lv-head strong{font-size:14px}.lv-head label{font-size:12px;color:var(--muted);font-weight:800}.lv-head input{width:64px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;text-align:right}
table.lv-table{width:100%;border-collapse:collapse;font-size:14px}table.lv-table th{text-align:left;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.05em;padding:0 6px 6px}table.lv-table td{padding:7px 6px;border-top:1px solid #eee}table.lv-table td.n{font-weight:900;width:56px}table.lv-table td.t{font-variant-numeric:tabular-nums}table.lv-table tr.reg td{background:#fff6e0}table.lv-table tr.now td{background:#e8f6ee}.tag{display:inline-block;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900;margin-left:6px}.tag.reg{background:#f5d78a;color:#6a4a00}.tag.now{background:#a8dfbf;color:#14532d}
.lv-empty{color:var(--muted);font-size:13px;line-height:1.7}.official{display:inline-block;margin-top:16px;color:#1a5fb4;font-size:13px;font-weight:800}
@media(max-width:720px){main{padding-inline:10px}.controls{border-radius:14px}.grid{grid-template-columns:1fr}.label{width:100%}.search{width:100%}.dl{grid-template-columns:repeat(2,minmax(0,1fr))}.sheet{border-radius:18px 18px 0 0;max-height:92vh}}
</style></head><body>
<header class="hero"><div class="wrap"><div class="eyebrow">PLAYERS GUIDE</div><h1 id="title">APT Championship Taipei 2026</h1><p class="sub" id="subtitle">MTT Schedule | Nov 12-29</p><div class="meta"><span>📍 Red Space（台北）</span><span id="rate">KRW / JPY</span><span id="updated"></span></div></div></header>
<main><section class="controls" id="controls"><div class="dates" id="dates"></div><div class="filters"><span class="label">GAME</span><button class="chip active" data-g="game" data-v="ALL">ALL</button><button class="chip" data-g="game" data-v="NLHE">NLHE</button><button class="chip" data-g="game" data-v="SAT">Satellite</button><button class="chip" data-g="game" data-v="OTHER">Other</button></div><div class="filters"><span class="label">BUY-IN</span><button class="chip active" data-g="price" data-v="ALL">ALL</button><button class="chip" data-g="price" data-v="LOW">〜¥8万</button><button class="chip" data-g="price" data-v="MID">¥8万〜¥34万</button><button class="chip" data-g="price" data-v="HIGH">¥34万〜</button><input class="search" id="search" type="search" placeholder="大会名・Event # を検索"></div></section><div class="status"><h2>Schedule</h2><span id="count"></span></div><div id="app" class="loading">スケジュールを読み込んでいます…</div></main><footer>時刻はすべて現地時間（KST ＝ 日本時間）。円は NT$1 = ¥4.99104（2026-09-26）換算の目安。<br>出典: Asian Poker Tour 公式（2026-09-25 取得）。主催は直前まで内容を差し替えます。エントリー前に公式ページで最終確認を。</footer>
<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"><div class="handle" id="handle"></div><div class="sheet-head" id="sheetHead"></div><div class="sheet-body" id="sheetBody"></div></section>
<script>
const state={events:[],date:'ALL',game:'ALL',price:'ALL',query:'',open:null,blindStatus:''},fmt=new Intl.NumberFormat('ja-JP');
document.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;state[b.dataset.g]=b.dataset.v;document.querySelectorAll(`[data-g="${b.dataset.g}"]`).forEach(x=>x.classList.toggle('active',x===b));render()});
document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value.trim().toLowerCase();render()});

/* 下スクロールでフィルタ帯を上へ流し、上スクロールで戻す */
let lastY=0;
addEventListener('scroll',()=>{const y=Math.max(0,scrollY),d=y-lastY;if(Math.abs(d)<4)return;lastY=y;
  if(d>0&&y>240)controls.classList.add('away');else controls.classList.remove('away')},{passive:true});

function start(d){state.events=d.events||[];state.blindStatus=d.blindStatus||'';title.textContent=d.title;subtitle.textContent=d.subtitle;rate.textContent=d.rate?`NT$1 = ¥${d.rate}`:'KRW / JPY';updated.textContent=`Updated ${d.updatedAt}`;dateTabs();render()}
function dateTabs(){const ds=[...new Set(state.events.map(e=>e.date))],tabs=[{v:'ALL',l:'ALL',n:state.events.length},...ds.map(d=>({v:d,l:`${+d.slice(5,7)}/${+d.slice(8,10)}`,n:state.events.filter(e=>e.date===d).length}))];dates.innerHTML=tabs.map(t=>`<button class="tab ${t.v===state.date?'active':''}" data-g="date" data-v="${t.v}">${t.l}<small>${t.n}</small></button>`).join('')}
function render(){const es=state.events.filter(e=>{const d=state.date==='ALL'||e.date===state.date,g=state.game==='ALL'||state.game===e.gameKey,p=(e.buyInJpy||0)/0.1137,pr=state.price==='ALL'||(state.price==='LOW'&&p<=700000)||(state.price==='MID'&&p>700000&&p<=3000000)||(state.price==='HIGH'&&p>3000000),q=!state.query||`${e.eventNo} ${e.name} ${e.game}`.toLowerCase().includes(state.query);return d&&g&&pr&&q});count.textContent=`${es.length} tournaments`;if(!es.length){app.className='empty';app.textContent='条件に一致する大会がありません。';return}const gs=es.reduce((a,e)=>((a[e.date]||=[]).push(e),a),{});app.className='';app.innerHTML=Object.entries(gs).map(([d,x])=>`<section class="day"><div class="day-title"><strong>${dateLabel(d)}</strong><span>${x[0].weekday||''}曜日 · ${x.length} events</span></div><div class="grid">${x.map(card).join('')}</div></section>`).join('')}
function card(e){const c=e.stripe||'';return`<article class="event ${c}" data-id="${esc(e.id)}" role="button" tabindex="0"><div class="top"><span class="no">${e.eventNo?'#'+esc(e.eventNo):'SPECIAL'}</span><span class="badge">${esc(e.category)} · ${esc(e.game)}</span></div><h3>${esc(e.name)}</h3><div class="facts"><div class="fact"><small>START</small><b>${esc(e.start)}</b></div><div class="fact"><small>REG. CLOSE</small><b>${esc(e.late)}</b></div><div class="fact"><small>BUY-IN</small><b class="price">${e.buyInKrw!=null?'NT$'+fmt.format(e.buyInKrw):'—'}${e.buyInJpy?`<small>約 ¥${fmt.format(e.buyInJpy)}</small>`:''}</b></div><div class="fact"><small>PRIZE POOL</small><b>${e.prizePoolKrw?'NT$'+fmt.format(e.prizePoolKrw):'—'}</b></div></div>${e.note?`<p class="note">${esc(e.note)}</p>`:''}<div class="more">タップで詳細・レベル対応表 ▸</div></article>`}
function dateLabel(d){return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'}).format(new Date(`${d}T00:00:00`))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fail(e){app.className='error';app.textContent=`読み込みに失敗しました: ${e.message||e}`}

/* ---------- 詳細シート ---------- */
app.addEventListener('click',e=>{const a=e.target.closest('.event');if(a)openSheet(a.dataset.id)});
app.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const a=e.target.closest('.event');if(a){e.preventDefault();openSheet(a.dataset.id)}});
backdrop.addEventListener('click',closeSheet);
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let dragY=null;
handle.addEventListener('touchstart',e=>{dragY=e.touches[0].clientY},{passive:true});
handle.addEventListener('touchmove',e=>{if(dragY==null)return;const dy=e.touches[0].clientY-dragY;if(dy>0)sheet.style.transform=`translate(-50%,${dy}px)`},{passive:true});
handle.addEventListener('touchend',e=>{const dy=(e.changedTouches[0].clientY-dragY);sheet.style.transform='';dragY=null;if(dy>90)closeSheet()});

function openSheet(id){const e=state.events.find(x=>String(x.id)===String(id));if(!e)return;state.open=e;
  sheetHead.innerHTML=`<span class="no">${e.eventNo?'#'+esc(e.eventNo):'SPECIAL'}</span><h3>${esc(e.name)}</h3><span class="badge">${esc(e.category)}</span><span class="badge">${esc(e.game)}</span>${e.gameType?`<span class="badge">${esc(e.gameType)}</span>`:''}`;
  sheetBody.innerHTML=`<div class="dl">
    <div><small>DATE</small><b>${esc(e.date)}<em>${esc(e.weekday||'')}</em></b></div>
    <div><small>START</small><b>${esc(e.start||'—')}</b></div>
    <div><small>REG. CLOSE</small><b>${esc(e.late||'—')}</b></div>
    <div><small>LATE REG</small><b>${regWindow(e)}</b></div>
    <div><small>BUY-IN</small><b class="price">${e.buyInKrw!=null?'NT$'+fmt.format(e.buyInKrw):'—'}${e.buyInJpy?`<em>約 ¥${fmt.format(e.buyInJpy)}</em>`:''}</b></div>
    <div><small>PRIZE POOL (GTD)</small><b>${e.prizePoolKrw?'NT$'+fmt.format(e.prizePoolKrw):'—'}</b></div>
    <div><small>STARTING STACK</small><b>${e.chips?fmt.format(e.chips)+'<em>ch</em>':'—'}</b></div>
    <div><small>LEVEL</small><b>${e.clock?e.clock+'<em>分</em>':'非公表'}</b></div>
  </div>
  <div class="lv"><div class="lv-head"><strong>レベル対応表</strong><span><label for="lvmin">1レベル</label> <input id="lvmin" type="number" min="1" max="120" step="1" value="${e.clock||''}" placeholder="分"> 分</span></div><div id="lvbox"></div></div>
  ${e.note?`<p class="note" style="border:0;padding-top:14px">${esc(e.note)}</p>`:''}
  <a class="official" href="${esc(e.sourceUrl||'')}" target="_blank" rel="noopener">公式スケジュールで確認 ▸</a>`;
  document.getElementById('lvmin').addEventListener('input',ev=>drawLevels(e,+ev.target.value));
  drawLevels(e,e.clock||0);
  sheet.classList.add('on');backdrop.classList.add('on');sheet.setAttribute('aria-hidden','false');document.body.classList.add('locked')}
function closeSheet(){sheet.classList.remove('on');backdrop.classList.remove('on');sheet.setAttribute('aria-hidden','true');document.body.classList.remove('locked');state.open=null}

const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(String(t||''));return m?+m[1]*60+ +m[2]:null};
const hhmm=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}${m>=1440?'⁺':''}`;
function regWindow(e){const s=toMin(e.start),c=toMin(e.late);if(s==null||c==null)return e.late==='Closed'?'新規参加不可':'—';const d=(c<s?c+1440:c)-s;return `${Math.floor(d/60)}時間${String(d%60).padStart(2,'0')}分`}
function drawLevels(e,mins){const box=document.getElementById('lvbox');const s=toMin(e.start);
  if(!mins||!s&&s!==0){box.innerHTML=`<p class="lv-empty">${e.late==='Closed'?'継続日のため対象外です。':'この大会はレベル時間が公表されていません。会場のストラクチャーシートの「1レベル◯分」を上の欄に入れると、レベルと時刻の対応表が出ます。'}</p>${blindLine()}`;return}
  const closeRaw=toMin(e.late),close=closeRaw==null?null:(closeRaw<s?closeRaw+1440:closeRaw);
  const n=Math.min(24,close?Math.ceil((close-s)/mins)+3:12);
  const now=nowMin(e.date);const rows=[];
  for(let i=1,t=s;i<=n;i++,t+=mins){const a=t,b=t+mins,reg=close!=null&&close>a&&close<=b,isNow=now!=null&&now>=a&&now<b;
    rows.push(`<tr class="${reg?'reg':''}${isNow?' now':''}"><td class="n">Lv ${i}</td><td class="t">${hhmm(a)} – ${hhmm(b)}</td><td>${reg?'<span class="tag reg">レジ締切</span>':''}${isNow?'<span class="tag now">NOW</span>':''}</td></tr>`)}
  box.innerHTML=`<table class="lv-table"><tr><th>LEVEL</th><th>TIME</th><th></th></tr>${rows.join('')}</table>
    <p class="lv-empty" style="margin:10px 0 4px">開始${e.start}から1レベル${mins}分で計算した目安です（休憩・ディナーブレイクは含みません）。${close!=null?'レジ締切 '+e.late+' は Lv '+Math.ceil((close-s)/mins)+' 付近。':''}</p>${blindLine()}`}
/* ブラインド額(100/200等)は公式・取得元とも未公開。毎朝の同期で公開をチェックし、状況をここに出す */
function blindLine(){const st=state.blindStatus||'';
  if(st.indexOf('公開を検出')===0)return `<p class="lv-empty" style="margin:6px 0 4px;color:#14532d;font-weight:800">ブラインド構造が公開された可能性があります → ${esc(st)}</p>`;
  return `<p class="lv-empty" style="margin:6px 0 4px">ブラインド額（例 100/200）は出典に載っていません。</p>`}
